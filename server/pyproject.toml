[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "server"
version = "0.1.0"
description = "HMM Part-of-Speech Tagger"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "requests>=2.28.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.vercel]
entrypoint = "app/main.py"
